[project]
name = "deeplearning_flask"
version = "1.0.0"
authors = [
  { name="alvertogit" },
]
description = "An example project combining Deep Learning and Flask"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "gunicorn==26.2.0",
    "numpy==2.5.4",
    "Pillow==12.3.0",
    "pytest==9.1.1",
    "requests==2.34.2",
    "scikit-image==0.26.0",
    "tensorflow==2.21.0",
]

[project.optional-dependencies]
dev = [
    "jupyterlab==4.6.4",
    "matplotlib==3.11.2",
    "pre-commit==4.7.0",
    "ruff==0.17.1",
]

[project.urls]
Homepage = "https://github.com/alvertogit/deeplearning_flask"

[tool.ruff]
extend-include = ["*.ipynb"]

line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    "W",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
ignore = []
